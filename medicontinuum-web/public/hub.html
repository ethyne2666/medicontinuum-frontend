<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>MediContinuum sync hub</title>
</head>
<body>
<!--
  Sync hub. NOT a backend: this static page owns the shared registry (localStorage of the patient-site origin).
  The Organization portal (another port = another origin) embeds it in a hidden iframe and talks to it with
  postMessage, so both apps read and write the SAME data. Only localhost origins are accepted — edit ALLOWED
  below if you host the apps elsewhere (they must then share one registrable domain, see README).
-->
<script>
(function () {
  var KEY = 'mc.registry.v1';
  var ALLOWED = /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/;

  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
  }

  window.addEventListener('message', function (e) {
    if (!ALLOWED.test(e.origin)) return;
    var m = e.data;
    if (!m || m.mc !== 'hub') return;
    function reply(payload) {
      payload.mc = 'hub'; payload.id = m.id;
      e.source.postMessage(payload, e.origin);
    }
    try {
      if (m.op === 'get') {
        reply({ ok: true, value: read() });
      } else if (m.op === 'set') {
        // compare-and-set on `rev` so two writers can never silently overwrite each other
        var cur = read();
        var rev = cur ? cur.rev : 0;
        if (m.expectedRev !== rev) return reply({ ok: false, conflict: true, value: cur });
        localStorage.setItem(KEY, JSON.stringify(m.value));
        reply({ ok: true, value: m.value });
      } else {
        reply({ ok: false, error: 'unknown op' });
      }
    } catch (err) {
      reply({ ok: false, error: String(err) });
    }
  });

  if (window.parent !== window) window.parent.postMessage({ mc: 'hub', ready: true }, '*');
})();
</script>
</body>
</html>
